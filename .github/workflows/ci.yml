name: Validate plugin packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: scenaro-plugins
          path: .artifacts/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag version
        run: python3 -c 'import json,os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("server.json"))["version"]'
      - run: python3 scripts/package.py
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes .artifacts/*.zip
